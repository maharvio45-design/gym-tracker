<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F0F7">
<title>Gym Log</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F1F0F7;
  --card:#fff;
  --ink:#14122B;
  --mut:#7A7891;
  --ac:#3B2FF0;
  --ln:#E4E2EE;
  --ok:#14A06B;
  --er:#E5384B;
  --soft:#F6F5FB;
}

[data-t=PUSH]{--tc:#FF6A3D}
[data-t=PULL]{--tc:#2E8BFF}
[data-t=LEGS]{--tc:#12B76A}
[data-t=UPPER]{--tc:#8B5CF6}
[data-t="CHEST+ARM"]{--tc:#EC4899}

*{
  box-sizing:border-box;
  margin:0;
}

body{
  font:15px/1.4 Barlow,system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  padding:
    env(safe-area-inset-top)
    0
    calc(100px + env(safe-area-inset-bottom));
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:5;
}

h1,h2,.big{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
}

h1{
  font-size:28px;
  letter-spacing:.3px;
}

h2{
  font-size:22px;
  margin:4px 0 8px;
}

#app{
  padding:0 14px 20px;
  max-width:560px;
  margin:auto;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:14px;
  margin-bottom:10px;
  position:relative;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

.grid .card{
  margin:0;
  border-radius:16px;
}

.k,.mut{
  color:var(--mut);
  font-size:12px;
}

.big{
  font-size:28px;
  line-height:1.1;
}

.big small{
  font-size:16px;
  margin-left:6px;
  opacity:.7;
  font-weight:600;
}

button{
  font:inherit;
  cursor:pointer;
  border:0;
  border-radius:12px;
  padding:10px 14px;
  background:var(--ink);
  color:#fff;
  font-weight:600;
}

.pri{
  background:var(--ac);
  width:100%;
  font:700 20px 'Barlow Condensed',sans-serif;
  padding:16px;
  margin-bottom:10px;
  border-radius:16px;
}

.fin{
  background:var(--ok);
}

.ghost{
  background:none;
  color:var(--ac);
  border:1.5px dashed var(--ac);
  width:100%;
  margin-top:8px;
}

.x{
  background:none;
  color:var(--mut);
  padding:4px 8px;
  font-size:18px;
}

.hero{
  background:var(--ac);
  color:#fff;
  border-radius:24px;
  padding:18px;
  margin-bottom:12px;
}

.hero .k{
  color:#fffa;
}

.hero .big{
  font-size:68px;
  line-height:.95;
  margin-top:2px;
}

.wk{
  display:flex;
  justify-content:space-between;
  margin-top:16px;
}

.wk span{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#ffffff26;
  display:grid;
  place-items:center;
  font-weight:600;
  font-size:13px;
  color:#ffffffcc;
}

.wk span.on{
  background:var(--tc);
  color:#fff;
  box-shadow:0 0 0 2px #fff;
}

.go{
  background:#fff;
  color:var(--ac);
  width:100%;
  margin-top:16px;
  font:700 20px 'Barlow Condensed',sans-serif;
  padding:14px;
  border-radius:14px;
}

.ah{
  background:var(--tc);
  color:#fff;
  border-radius:20px;
  padding:16px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}

.ah .big{
  font-size:42px;
}

.chips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:8px 0;
}

.chip{
  background:#fff;
  color:var(--ink);
  padding:8px 14px;
  border-radius:99px;
}

.chip[data-t]{
  box-shadow:inset 0 -3px 0 var(--tc);
}

.chip.on{
  background:var(--tc,var(--ink));
  color:#fff;
  box-shadow:none;
}

input,select,textarea{
  font:inherit;
  padding:11px 12px;
  border:1.5px solid transparent;
  border-radius:12px;
  width:100%;
  background:var(--soft);
  color:var(--ink);
}

input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--ac);
  background:#fff;
}

.set{
  display:grid;
  grid-template-columns:58px 1fr 1fr 56px 26px;
  gap:5px;
  align-items:center;
  margin-top:8px;
}

.set input{
  text-align:center;
  font-weight:600;
  font-size:17px;
  padding:12px 4px;
}

.set small{
  display:block;
  color:var(--mut);
  font-size:11px;
}

.xn{
  position:absolute;
  right:6px;
  top:6px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:3px 0;
}

.pill{
  font-size:13px;
  background:#fff;
  color:var(--ink);
  padding:6px 12px;
  border-radius:99px;
}

.dk{
  background:var(--ink)!important;
  color:#fff;
}

.dk .k{
  color:#fff9;
}

.ins{
  background:#E9E7FF!important;
}

.ins p{
  margin-top:4px;
}

.bar{
  height:8px;
  background:var(--soft);
  border-radius:9px;
  overflow:hidden;
  margin:2px 0 8px;
}

.bar i{
  display:block;
  height:100%;
  background:var(--tc);
  border-radius:9px;
}

.hc{
  border-left:6px solid var(--tc);
}

.bd{
  background:var(--tc);
  color:#fff;
  border-radius:99px;
  padding:2px 10px;
  font-size:12px;
  font-weight:600;
  margin-left:4px;
}

nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:calc(10px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:var(--ink);
  border-radius:24px;
  padding:6px;
  z-index:6;
  max-width:536px;
  margin:auto;
}

nav button{
  background:none;
  color:#ffffff99;
  padding:8px 2px;
  font-size:11px;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}

nav button.on{
  background:#ffffff24;
  color:#fff;
}

.mod{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  z-index:9;
}

.mod>div{
  background:#fff;
  width:100%;
  max-width:560px;
  margin:auto auto 0;
  border-radius:24px 24px 0 0;
  padding:18px;
  max-height:88vh;
  overflow:auto;
}

.ch{
  width:100%;
  height:auto;
}

.pr{
  background:#FFF4CC;
  border:1px solid #F5B700;
  color:#6b5000;
  font-weight:600;
}

.t5{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

.t5 button{
  background:var(--tc);
  font:700 22px 'Barlow Condensed',sans-serif;
  padding:20px;
  border-radius:18px;
}

.t5 button:first-child{
  grid-column:span 2;
}

label{
  display:block;
  margin-top:8px;
}

.smallbtn{
  padding:7px 10px;
  font-size:13px;
}

.danger{
  color:var(--er)!important;
  background:#fff!important;
  border:1px solid #ffd3d8!important;
}

.editbox{
  background:var(--soft);
  border-radius:14px;
  padding:10px;
  margin-top:8px;
}

.edit-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.edit-actions button{
  flex:1;
}

.empty{
  text-align:center;
  padding:20px 8px;
  color:var(--mut);
}

@media(max-width:390px){
  .set{
    grid-template-columns:52px 1fr 1fr 50px 24px;
  }

  .set input{
    font-size:15px;
  }

  .hero .big{
    font-size:58px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Gym Log</h1>
  <button class="pill" id="pill" onclick="cfg()">⚪</button>
</header>

<main id="app"></main>

<nav id="nav"></nav>

<datalist id="dl"></datalist>

<script>
const TYPES=[
  'PUSH',
  'PULL',
  'LEGS',
  'UPPER',
  'CHEST+ARM'
];

const MON=[
  'Jan','Feb','Mar','Apr','May','Jun',
  'Jul','Aug','Sep','Oct','Nov','Dec'
];

const K='gymlog_v2';

const DEF_EX=[
  'Bench Press',
  'Incline Bench Press',
  'Incline Dumbbell Press',
  'Dumbbell Press',
  'Shoulder Press',
  'Lat Pulldown',
  'Seated Row',
  'Barbell Row',
  'Cable Row',
  'Face Pull',
  'Squat',
  'Leg Press',
  'Leg Extension',
  'Leg Curl',
  'Romanian Deadlift',
  'Calf Raise',
  'Dumbbell Curl',
  'Bicep Curl',
  'Tricep Pushdown',
  'Lateral Raise'
];

const DEF_TPL={
  PUSH:[
    'Bench Press',
    'Incline Dumbbell Press',
    'Shoulder Press',
    'Lateral Raise',
    'Tricep Pushdown'
  ],

  PULL:[
    'Lat Pulldown',
    'Seated Row',
    'Face Pull',
    'Dumbbell Curl'
  ],

  LEGS:[
    'Squat',
    'Leg Press',
    'Leg Extension',
    'Leg Curl',
    'Calf Raise'
  ],

  UPPER:[
    'Bench Press',
    'Lat Pulldown',
    'Shoulder Press',
    'Seated Row',
    'Lateral Raise',
    'Bicep Curl',
    'Tricep Pushdown'
  ],

  'CHEST+ARM':[
    'Bench Press',
    'Incline Dumbbell Press',
    'Dumbbell Press',
    'Dumbbell Curl',
    'Bicep Curl',
    'Tricep Pushdown'
  ]
};

const $=s=>document.querySelector(s);

const num=v=>{
  const n=Number(v);
  return Number.isFinite(n)
    ? Math.round(n*10)/10
    : 0;
};

const fmt=n=>{
  const x=Number(n)||0;
  return Math.round(x).toLocaleString('en-US');
};

const pad=n=>String(n).padStart(2,'0');

const slug=n=>
  n
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-|-$/g,'');

const today=()=>{
  const d=new Date();

  return [
    d.getFullYear(),
    pad(d.getMonth()+1),
    pad(d.getDate())
  ].join('-');
};


/*
  DATE FIX
  ------------------------------------------------------------
  Fungsi ini menerima semua format yang mungkin datang
  dari Google Sheets / Apps Script.

  Contoh:
    2026-10-02
    2026-10-02T00:00:00.000Z
    2026-10-02T17:00:00.000Z
    02/10/2026
    2026/10/02

  Hasil selalu:
    2026-10-02
*/

function dateOnly(v){

  if(v===null || v===undefined || v===''){
    return '';
  }

  if(v instanceof Date && !isNaN(v.getTime())){
    return [
      v.getFullYear(),
      pad(v.getMonth()+1),
      pad(v.getDate())
    ].join('-');
  }

  const s=String(v).trim();

  // yyyy-mm-dd
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);

  if(m){
    return [
      m[1],
      pad(m[2]),
      pad(m[3])
    ].join('-');
  }

  // dd/mm/yyyy
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

  if(m){
    return [
      m[3],
      pad(m[2]),
      pad(m[1])
    ].join('-');
  }

  // yyyy/mm/dd
  m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);

  if(m){
    return [
      m[1],
      pad(m[2]),
      pad(m[3])
    ].join('-');
  }

  return s;
}


const fd=s=>{
  const d=dateOnly(s);

  if(!d || !d.includes('-')){
    return s||'';
  }

  const p=d.split('-');

  if(p.length!==3){
    return s;
  }

  return `${p[2]} ${MON[Number(p[1])-1]} ${p[0]}`;
};


const addD=(s,n)=>{
  const d=new Date(dateOnly(s)+'T12:00:00');

  if(isNaN(d.getTime())){
    return s;
  }

  d.setDate(d.getDate()+n);

  return [
    d.getFullYear(),
    pad(d.getMonth()+1),
    pad(d.getDate())
  ].join('-');
};


const mon=s=>{
  const d=new Date(dateOnly(s)+'T12:00:00');

  if(isNaN(d.getTime())){
    return dateOnly(s);
  }

  const day=(d.getDay()+6)%7;

  return addD(dateOnly(s),-day);
};


const newWid=()=>{
  const d=new Date();

  return 'W'+
    String(d.getFullYear()).slice(2)+
    pad(d.getMonth()+1)+
    pad(d.getDate())+
    '-'+
    pad(d.getHours())+
    pad(d.getMinutes())+
    pad(d.getSeconds());
};


const esc=s=>
  String(s??'')
    .replace(/[&<>"]/g,c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;'
    }[c]));


let S=load();

let tab='dash';
let tplT='PUSH';

let hf={
  t:'',
  m:today().slice(0,7)
};

let pe='';
let syncing=false;
let stat='off';


function load(){

  try{

    const raw=localStorage.getItem(K);

    if(raw){

      const s=JSON.parse(raw);

      s.workouts=Array.isArray(s.workouts)?s.workouts:[];
      s.sets=Array.isArray(s.sets)?s.sets:[];
      s.exercises=Array.isArray(s.exercises)?s.exercises:[];
      s.body=Array.isArray(s.body)?s.body:[];
      s.prs=Array.isArray(s.prs)?s.prs:[];
      s.q=Array.isArray(s.q)?s.q:[];

      s.tpl=s.tpl||{};

      TYPES.forEach(t=>{
        if(!Array.isArray(s.tpl[t])){
          s.tpl[t]=DEF_TPL[t]||[];
        }
      });

      return s;
    }

  }catch(e){
    console.warn('Load error',e);
  }

  return {
    workouts:[],
    sets:[],
    exercises:DEF_EX.map((name,i)=>({
      id:'E'+(i+1),
      name,
      active:true
    })),
    body:[],
    prs:[],
    tpl:JSON.parse(JSON.stringify(DEF_TPL)),
    q:[],
    url:'',
    active:null
  };
}


function save(){

  try{
    localStorage.setItem(K,JSON.stringify(S));
  }catch(e){
    console.warn('Save error',e);
  }
}


/* =========================================================
   SYNC
========================================================= */

function setSt(s){

  stat=s;

  const p=$('#pill');

  if(!p)return;

  const n=S.q.length;

  const labels={
    ok:'🟢 Synced',
    sync:'🟡 Syncing',
    err:'🔴 Sync Error'+(n?' ('+n+')':''),
    off:'⚪ Belum terhubung'+(n?' ('+n+')':'')
  };

  p.textContent=labels[s]||'⚪';
}


function enq(sheet,rows){

  if(!rows || !rows.length)return;

  S.q.push({
    sheet,
    rows
  });

  save();
  sync();
}


async function sync(){

  if(!S.url){
    setSt('off');
    return;
  }

  if(syncing)return;

  syncing=true;

  while(S.q.length){

    setSt('sync');

    try{

      const response=await fetch(
        S.url,
        {
          method:'POST',
          headers:{
            'Content-Type':'text/plain;charset=utf-8'
          },
          body:JSON.stringify(S.q[0])
        }
      );

      const j=await response.json();

      if(!j.ok){
        throw new Error(j.error||'Sync gagal');
      }

      S.q.shift();
      save();

    }catch(e){

      console.error(e);

      setSt('err');
      syncing=false;
      return;
    }
  }

  syncing=false;
  setSt('ok');
}


async function pull(){

  if(!S.url){
    alert('Masukkan URL Web App terlebih dahulu.');
    return;
  }

  await sync();

  if(S.q.length){
    alert(
      'Masih ada data yang belum terkirim. '+
      'Tunggu sampai status 🟢 Synced.'
    );

    return;
  }

  try{

    setSt('sync');

    const response=await fetch(
      S.url+'?action=all&t='+Date.now(),
      {
        cache:'no-store'
      }
    );

    const j=await response.json();

    if(j.ok===false){
      throw new Error(j.error||'Gagal mengambil data.');
    }

    /*
      WORKOUTS
    */

    if(Array.isArray(j.WORKOUTS)){

      S.workouts=j.WORKOUTS.map(r=>({
        id:String(r.workout_id||''),
        date:dateOnly(r.date),
        type:String(r.workout_type||''),
        dur:Number(r.duration)||0,
        vol:Number(r.total_volume)||0,
        notes:String(r.notes||'')
      }));
    }


    /*
      SETS
    */

    if(Array.isArray(j.SETS)){

      S.sets=j.SETS.map(r=>({
        id:String(r.set_id||''),
        wid:String(r.workout_id||''),
        ex:String(r.exercise||''),
        n:Number(r.set_number)||0,
        w:Number(r.weight)||0,
        r:Number(r.reps)||0,
        rpe:r.rpe===''||r.rpe==null?'':Number(r.rpe),
        vol:Number(r.volume)||0,
        notes:String(r.notes||'')
      }));
    }


    /*
      EXERCISES
    */

    if(Array.isArray(j.EXERCISES) && j.EXERCISES.length){

      S.exercises=j.EXERCISES.map(r=>({
        id:String(r.exercise_id||''),
        name:String(r.exercise_name||''),
        active:
          r.active!==false &&
          String(r.active).toUpperCase()!=='FALSE'
      }));
    }


    /*
      BODY
    */

    if(Array.isArray(j.BODY_PROGRESS)){

      S.body=j.BODY_PROGRESS.map(r=>({
        date:dateOnly(r.date),
        w:r.weight===''||r.weight==null?'':Number(r.weight),
        waist:r.waist===''||r.waist==null?'':Number(r.waist),
        bf:r.body_fat===''||r.body_fat==null?'':Number(r.body_fat),
        mm:r.muscle_mass===''||r.muscle_mass==null?'':Number(r.muscle_mass),
        notes:String(r.notes||'')
      }));
    }


    /*
      PERSONAL RECORDS
    */

    if(Array.isArray(j.PERSONAL_RECORDS)){

      S.prs=j.PERSONAL_RECORDS.map(r=>({
        date:dateOnly(r.date),
        ex:String(r.exercise||''),
        type:String(r.record_type||''),
        w:Number(r.weight)||0,
        r:Number(r.reps)||0,
        vol:Number(r.volume)||0
      }));
    }


    save();
    setSt('ok');
    render();

    alert('Data dari Google Sheets berhasil dimuat.');

  }catch(e){

    console.error(e);

    setSt('err');

    alert(
      'Gagal menarik data dari Sheets.\n\n'+
      e.message
    );
  }
}

<script>
/* =========================================================
   GOOGLE SHEETS CONFIG
========================================================= */

function cfg(){

  const m=document.createElement('div');

  m.className='mod';
  m.id='cfg';

  m.innerHTML=`
    <div>

      <h2>Google Sheets</h2>

      <label class="k">
        URL Web App (Apps Script)
      </label>

      <input
        id="u"
        value="${esc(S.url)}"
        placeholder="https://script.google.com/macros/s/.../exec"
      >

      <p class="mut" style="margin:8px 0">
        Antrean belum terkirim:
        <b>${S.q.length}</b>
      </p>

      <button
        style="width:100%;margin-top:6px"
        onclick="saveUrl()"
      >
        Simpan & Sync
      </button>

      <button
        style="width:100%;margin-top:8px;background:#fff;color:var(--ink);border:1px solid var(--ln)"
        onclick="pull()"
      >
        Tarik data dari Sheets
      </button>

      <button
        style="width:100%;margin-top:8px;background:#fff;color:var(--ink);border:1px solid var(--ln)"
        onclick="exportJSON()"
      >
        Backup data lokal
      </button>

      <button
        style="width:100%;margin-top:8px;background:none;color:var(--mut)"
        onclick="$('#cfg').remove()"
      >
        Tutup
      </button>

    </div>
  `;

  document.body.appendChild(m);
}


function saveUrl(){

  const url=$('#u').value.trim();

  S.url=url;

  /*
    Kirim daftar exercise pertama kali
    jika belum pernah dikirim.
  */

  if(
    S.url &&
    !S.exSynced &&
    S.exercises.length
  ){

    S.exSynced=true;

    S.q.push({
      sheet:'EXERCISES',
      rows:S.exercises.map(e=>[
        e.id,
        e.name,
        e.active
      ])
    });
  }

  save();

/*
  Riwayat exercise per workout.
*/

function exH(ex){

  const m={};

  S.sets
    .filter(s=>s.ex===ex)
    .forEach(
      s=>
        (m[s.wid]=m[s.wid]||[]).push(s)
    );

  return Object
    .entries(m)
    .map(([id,ss])=>{

      const w=S.workouts.find(
        x=>x.id===id
      );

      return{
        date:w?dateOnly(w.date):'',
        ss,
        mw:ss.length
          ?Math.max(
            ...ss.map(
              s=>Number(s.w)||0
            )
          )
          :0
      };
    })
    .sort(
      (a,b)=>
        a.date<b.date
          ?-1
          :a.date>b.date
            ?1
            :0
    );
}


/* =========================================================
   CHART
========================================================= */

function chart(pts,u){

  pts=(pts||[]).filter(
    x=>
      x &&
      Number.isFinite(Number(x.v))
  ).slice(-30);

  if(pts.length<2){
    return`
      <p class="mut">
        Butuh minimal 2 data untuk grafik.
      </p>
    `;
  }

  const W=320;
  const H=120;
  const p=18;

  const vs=pts.map(x=>Number(x.v));

  let mn=Math.min(...vs);
  let mx=Math.max(...vs);

  if(mn===mx){
    mn-=1;
    mx+=1;
  }

  const X=i=>
    p+
    i*(W-2*p)/
    (pts.length-1);

  const Y=v=>
    H-p-
    (Number(v)-mn)/
    (mx-mn)*
    (H-2*p);

  const points=pts
    .map(
      (x,i)=>
        X(i)+','+Y(x.v)
    )
    .join(' ');

  return`
    <svg
      viewBox="0 0 ${W} ${H}"
      class="ch"
    >

      <polygon
        fill="#3B2FF0"
        opacity=".1"
        points="
          ${X(0)},${H-p}
          ${points}
          ${X(pts.length-1)},${H-p}
        "
      />

      <polyline
        fill="none"
        stroke="#3B2FF0"
        stroke-width="2.5"
        points="${points}"
      />

      ${pts.map(
        (x,i)=>`
          <circle
            cx="${X(i)}"
            cy="${Y(x.v)}"
            r="3"
            fill="#3B2FF0"
          />
        `
      ).join('')}

      <text
        x="2"
        y="12"
        font-size="10"
        fill="#6B7480"
      >
        ${num(mx)}${u}
      </text>

      <text
        x="2"
        y="${H-4}"
        font-size="10"
        fill="#6B7480"
      >
        ${num(mn)}${u}
      </text>

    </svg>
  `;
}

/* =========================================================
   DASHBOARD
========================================================= */

function dash(){

  const w=bs('w');

  const lw=w[w.length-1];
  const pw=w[w.length-2];

  const wa=bs('waist');
  const la=wa[wa.length-1];

  const ws=wsorted();
  const last=ws[ws.length-1];

  const t=today();

  const wk=mon(t);
  const pk=addD(wk,-7);

  const ym=t.slice(0,7);

  const inW=ws.filter(
    x=>mon(x.date)===wk
  );

  const inM=ws.filter(
    x=>dateOnly(x.date).slice(0,7)===ym
  );

  const vW=inW.reduce(
    (a,x)=>a+(Number(x.vol)||0),
    0
  );

  const vP=ws
    .filter(x=>mon(x.date)===pk)
    .reduce(
      (a,x)=>a+(Number(x.vol)||0),
      0
    );

  const wkS=new Set(
    ws.map(x=>mon(x.date))
  );

  let c=0;
  let cur=wk;

  if(!wkS.has(cur)){
    cur=pk;
  }

  while(wkS.has(cur)){
    c++;
    cur=addD(cur,-7);
  }

  const ins=[
    'Workout minggu ini: '+inW.length
  ];

  if(vP&&vW){

    const diff=Math.round(
      ((vW-vP)/vP)*100
    );

    ins.push(
      `Volume minggu ini ${
        vW>=vP?'naik':'turun'
      } ${Math.abs(diff)}% dibanding minggu lalu.`
    );
  }

  let ups=0;

  if(last){

    [
      ...new Set(
        S.sets
          .filter(s=>s.wid===last.id)
          .map(s=>s.ex)
      )
    ].forEach(e=>{

      const h=exH(e);

      if(h.length>1){

        const d=
          h[h.length-1].mw-
          h[h.length-2].mw;

        if(d>0)ups++;

        if(d){

          ins.push(
            `${e}: ${
              d>0?'+':''
            }${num(d)} kg dibanding workout sebelumnya.`
          );
        }
      }
    });
  }

  if(lw&&pw){

    const d=
      Number(lw.w||0)-
      Number(pw.w||0);

    ins.push(
      `Berat badan: ${pw.w} kg → ${lw.w} kg.`
    );
  }


  const wd=[
    0,1,2,3,4,5,6
  ].map(i=>{

    const d=addD(wk,i);

    const workout=ws.find(
      x=>dateOnly(x.date)===d
    );

    return`
      <span
        ${workout?
          `class="on" data-t="${workout.type}"`
          :''
        }
        ${d===t?
          'style="outline:2px dashed #fffa;outline-offset:2px"'
          :''
        }
      >
        ${'SSRKJSM'[i]}
      </span>
    `;

  }).join('');


  return`

    <div class="hero">

      <div class="k">
        Minggu ini
      </div>

      <div class="big">
        ${inW.length}
        <small>workout</small>
      </div>

      <div class="wk">
        ${wd}
      </div>

      <button
        class="go"
        onclick="tab='workout';render()"
      >
        ${
          S.active
            ?'Lanjutkan '+S.active.type
            :'Start Workout'
        }
      </button>

    </div>


    <div class="grid">

      ${tile(
        'Berat badan',
        lw?lw.w+' kg':'–'
      )}

      ${tile(
        'Perubahan',
        lw&&pw
          ?(
            Number(lw.w)-Number(pw.w)>0
              ?'+':''
          )+
          num(
            Number(lw.w)-Number(pw.w)
          )+
          ' kg'
          :'–'
      )}

      ${tile(
        'Lingkar pinggang',
        la?la.waist+' cm':'–'
      )}

      ${tile(
        'Streak',
        c+' minggu'
      )}

      ${tile(
        'Volume minggu ini',
        fmt(vW)+' kg'
      )}

      ${tile(
        'Bulan ini',
        inM.length+' workout'
      )}

      ${tile(
        'Total volume',
        fmt(
          ws.reduce(
            (a,x)=>a+(Number(x.vol)||0),
            0
          )
        )+' kg',
        'dk'
      )}

      ${tile(
        'Progress strength',
        ups+' exercise naik'
      )}

    </div>


    <div class="card">

      <div class="k">
        Workout terakhir
      </div>

      ${
        last
          ?`
            <b>${esc(last.type)}</b>
            · ${fd(last.date)}
            · ${fmt(last.vol)} kg
          `
          :'Belum ada workout.'
      }

    </div>


    <div class="card">

      <div class="k">
        Frekuensi bulan ini
      </div>

      ${
        TYPES.map(x=>{

          const n=inM.filter(
            m=>m.type===x
          ).length;

          const mx=Math.max(
            1,
            ...TYPES.map(
              y=>
                inM.filter(
                  m=>m.type===y
                ).length
            )
          );

          return`
            <div class="row">
              <span>${x}</span>
              <b>${n} kali</b>
            </div>

            <div
              class="bar"
              data-t="${x}"
            >
              <i
                style="width:${n/mx*100}%"
              ></i>
            </div>
          `;

        }).join('')
      }

    </div>


    <div class="card ins">

      <div class="k">
        Insight
      </div>

      ${
        ins.map(
          i=>`<p>${esc(i)}</p>`
        ).join('')
      }

    </div>


    <div class="card">

      <div class="k">
        Grafik berat badan
      </div>

      ${chart(
        w.map(

        ),
        ' kg'
      )}

    </div>


    <div class="card">

      <div class="k">
        Grafik lingkar pinggang

        wa.map(

        ),

}

function managerAddExercise(){

  const el=$('#newExName');

  if(!el)return;

  const name=el.value.trim();

  if(!name)return;

  ensureEx(name);

  save();

  $('#exm')?.remove();

  manageExercises();

  render();
}


function renameExercise(id){

  const e=S.exercises.find(
    x=>x.id===id
  );

  const input=$('#ename_'+CSS.escape(id));

  if(!e||!input)return;

  const name=input.value.trim();

  if(!name)return;

  const old=e.name;

  if(
    name.toLowerCase()!==
    old.toLowerCase()&&
    S.exercises.some(
      x=>
        x.id!==id&&
        x.name.toLowerCase()===
        name.toLowerCase()
    )
  ){

    return alert(
      'Nama exercise tersebut sudah ada.'
    );
  }


  e.name=name;

  /*
    Update nama exercise pada
    seluruh history lokal juga.
  */

  S.sets.forEach(
    s=>{
      if(s.ex===old){
        s.ex=name;
      }
    }
  );


  Object.keys(S.tpl).forEach(
    t=>{
      S.tpl[t]=S.tpl[t].map(
        x=>x===old?name:x
      );
    }
  );


  save();


  /*
    Sinkronisasi exercise.
  */

  enq(
    'EXERCISES',
    [[
      e.id,
      e.name,
      e.active
    ]]
  );


  $('#exm')?.remove();

  manageExercises();

  render();
}


function toggleExercise(id){

  const e=S.exercises.find(
    x=>x.id===id
  );

  if(!e)return;

  e.active=!e.active;

  save();

  enq(
    'EXERCISES',
    [[
      e.id,
      e.name,
      e.active
    ]]
  );


  $('#exm')?.remove();

  manageExercises();

  render();
}


function deleteExercise(id){

  const e=S.exercises.find(
    x=>x.id===id
  );

  if(!e)return;


  const used=
    S.sets.some(
      s=>s.ex===e.name
    )||
    Object.values(S.tpl).some(
      arr=>arr.includes(e.name)
    );


  if(used){

    /*
      Jangan hapus exercise yang sudah
      dipakai history. Cukup nonaktifkan.
    */

    if(
      !confirm(
        'Exercise ini sudah digunakan dalam history/template. Nonaktifkan saja?'
      )
    ){
      return;
    }

    e.active=false;

    save();

    enq(
      'EXERCISES',
      [[
        e.id,
        e.name,
        e.active
      ]]
    );

  }else{

    if(
      !confirm(
        'Hapus exercise ini?'
      )
    ){
      return;
    }

    S.exercises=
      S.exercises.filter(
        x=>x.id!==id
      );

    save();

    /*
      Google Sheet tidak punya delete
      operation dalam backend sederhana ini,
      jadi exercise dihapus lokal.
    */
  }


  $('#exm')?.remove();

  manageExercises();

  render();
}

const vol=s=>

function start(t){

  S.active={
    type:t,
    date:today(),
    start:Date.now(),
    notes:'',
    ex:(S.tpl[t]||[])
      .map(blank)
  };

  save();

  render();

  scrollTo(0,0);
}


function blank(n){

  const l=[
    ...S.sets
  ]
  .reverse()
  .find(
    s=>s.ex===n
  );

  return{
    name:n,
    notes:'',
    sets:[
      {
        w:l?l.w:'',
        r:l?l.r:'',
        rpe:''
      }
    ]
  };
}


function ensureEx(n){

  n=n.trim();

  if(!n)return'';


  const f=S.exercises.find(
    e=>
      e.name.toLowerCase()===
      n.toLowerCase()
  );


  if(f){

    /*
      Jika exercise sebelumnya nonaktif,
      otomatis aktifkan lagi karena user
      baru saja memilihnya.
    */

    if(!f.active){

      f.active=true;

      if(S.url){

        enq(
          'EXERCISES',
          [[
            f.id,
            f.name,
            true
          ]]
        );

      }

    }

    return f.name;
  }


  const id=
    'E-'+
    slug(n)+
    '-'+
    Date.now().toString(36);


  const e={
    id,
    name:n,
    active:true
  };


  S.exercises.push(e);


  if(S.url){

    enq(
      'EXERCISES',
      [[
        e.id,
        e.name,
        true
      ]]
    );

  }


  return n;
}

/* =========================================================
   FINISH WORKOUT
========================================================= */

function finish(){

  const a=S.active;

  if(!a)return;


  /*
    Ambil hanya set yang mempunyai
    berat + reps valid.
  */

  const exs=a.ex
    .map(
      e=>({
        ...e,
        sets:e.sets.filter(
          s=>
            Number(s.w)>0 &&
            Number(s.r)>0
        )
      })
    )
    .filter(
      e=>e.sets.length
    );


  if(!exs.length){

    return alert(
      'Isi minimal satu set dengan berat dan reps.'
    );

  }


  const wid=newWid();


  const dur=Math.max(
    1,
    Math.round(
      (Date.now()-a.start)/60000
    )
  );


  const prs=[];
  const rows=[];

  let tv=0;
  let sn=0;


  exs.forEach(e=>{

    /*
      Semua set exercise yang pernah
      dilakukan sebelumnya.
    */

    const pv=S.sets.filter(
      s=>s.ex===e.name
    );


    const sets=e.sets.map(
      s=>({

        w:Number(s.w),

        r:Number(s.r),

        v:
          Number(s.w)*
          Number(s.r)

      })
    );


    /*
      Cari PR.
    */

    if(pv.length){

      const definitions=[

        {
          type:'Maximum Weight',
          current:s=>Number(s.w)||0,
          previous:p=>Number(p.w)||0
        },

        {
          type:'Maximum Reps',
          current:s=>Number(s.r)||0,
          previous:p=>Number(p.r)||0
        },

        {
          type:'Maximum Volume',
          current:s=>Number(s.v)||0,
          previous:p=>Number(p.vol)||0
        }

      ];


      definitions.forEach(d=>{

        const b=
          sets.reduce(
            (m,s)=>
              d.current(s)>
              d.current(m)
                ?s
                :m,
            sets[0]
          );


        const old=
          pv.reduce(
            (m,p)=>
              d.previous(p)>
              d.previous(m)
                ?p
                :m,
            pv[0]
          );


        if(
          d.current(b)>
          d.previous(old)
        ){

          prs.push({

            date:a.date,

            ex:e.name,

            type:d.type,

            w:b.w,

            r:b.r,

            vol:b.v,

            pw:Number(old.w)||0,

            pr:Number(old.r)||0

          });

        }

      });

    }


    /*
      Masukkan semua set ke database lokal.
    */

    e.sets.forEach(
      (s,j)=>{

        const o={

          id:
            'S'+
            wid.slice(1)+
            '-'+
            pad(++sn),

          wid,

          ex:e.name,

          n:j+1,

          w:Number(s.w),

          r:Number(s.r),

          rpe:
            s.rpe===''||
            s.rpe===null||
            s.rpe===undefined
              ?''
              :Number(s.rpe),

          vol:
            Number(s.w)*
            Number(s.r),

          notes:e.notes||''

        };


        tv+=o.vol;

        S.sets.push(o);

        rows.push(o);

      }

    );

  });


  /*
    Workout utama.
  */

  const w={

    id:wid,

    date:a.date,

    type:a.type,

    dur,

    vol:tv,

    notes:a.notes||''

  };


  S.workouts.push(w);


  /*
    Simpan PR lokal.
  */

  S.prs.push(
    ...prs.map(
      ({
        pw,
        pr,
        ...p
      })=>p
    )
  );


  S.active=null;

  save();


  /*
    Masukkan ke queue Google Sheets.
  */

  S.q.push({

    sheet:'WORKOUTS',

    rows:[[
      w.id,
      w.date,
      w.type,
      w.dur,
      w.vol,
      w.notes
    ]]

  });


  S.q.push({

    sheet:'SETS',

    rows:
      rows.map(
        o=>[
          o.id,
          o.wid,
          o.ex,
          o.n,
          o.w,
          o.r,
          o.rpe,
          o.vol,
          o.notes
        ]
      )

  });


  if(prs.length){

    S.q.push({

      sheet:'PERSONAL_RECORDS',

      rows:
        prs.map(
          p=>[
            p.date,
            p.ex,
            p.type,
            p.w,
            p.r,
            p.vol
          ]
        )

    });

  }


  save();

  sync();


  /*
    Pindahkan ke History.
  */

  tab='hist';

  hf={
    t:'',
    m:dateOnly(a.date).slice(0,7)
  };


  render();


  /*
    Modal selesai workout.
  */

  const m=
    document.createElement('div');

  m.className='mod';


  m.onclick=e=>{

    if(e.target===m){
      m.remove();
    }

  };


  m.innerHTML=`

    <div>

      <h2>
        Workout selesai 🎉
      </h2>


      <p>
        ${esc(a.type)}
        · ${dur} menit
        · ${fmt(tv)} kg volume
      </p>


      ${
        prs.map(
          p=>`

            <div class="card pr">

              🏆
              <b>
                NEW PR
              </b>

              <br>

              ${esc(p.ex)}

              <br>

              ${esc(p.type)}:
              ${p.w} kg × ${p.r}

              <div class="mut">
                Previous:
                ${p.pw} kg × ${p.pr}
              </div>

            </div>

          `
        ).join('')
      }


      <button
        style="
          width:100%;
          margin-top:8px
        "
        onclick="
          this.closest('.mod').remove()
        "
      >
        OK
      </button>

    </div>

  `;


  document.body.appendChild(m);
}


/* =========================================================
   EDIT WORKOUT
========================================================= */

function editWorkout(id){

  const w=S.workouts.find(
    x=>x.id===id
  );

  if(!w)return;


  const oldSets=S.sets.filter(
    s=>s.wid===id
  );


  /*
    Ubah workout lama menjadi
    workout aktif sementara.
  */

  S.active={

    type:w.type,

    date:dateOnly(w.date),

    start:
      Date.now()-
      ((Number(w.dur)||1)*60000),

    notes:w.notes||'',

    editId:id,

    ex:[]

  };


  const names=[
    ...new Set(
      oldSets.map(
        s=>s.ex
      )
    )
  ];


  names.forEach(
    name=>{

      const sets=
        oldSets
          .filter(
            s=>s.ex===name
          )
          .sort(
            (a,b)=>
              Number(a.n)-
              Number(b.n)
          );


      S.active.ex.push({

        name,

        notes:
          sets[0]?.notes||'',

        sets:
          sets.map(
            s=>({

              w:s.w,

              r:s.r,

              rpe:
                s.rpe===null||
                s.rpe===undefined
                  ?''
                  :s.rpe

            })
          )

      });

    }
  );


  save();

  tab='workout';

  render();

  scrollTo(0,0);
}


/* =========================================================
   DELETE WORKOUT
========================================================= */

function deleteWorkout(id){

  const w=S.workouts.find(
    x=>x.id===id
  );

  if(!w)return;


  if(
    !confirm(
      `Hapus workout ${dateOnly(w.date)}?`
    )
  ){
    return;
  }


  /*
    Hapus workout dan set lokal.
  */

  S.workouts=
    S.workouts.filter(
      x=>x.id!==id
    );


  S.sets=
    S.sets.filter(
      x=>x.wid!==id
    );


  /*
    PR akan dihitung ulang
    berdasarkan history yang tersisa.
  */

  rebuildPR();


  save();


  /*
    Queue khusus DELETE.
    Backend GS versi yang baru akan
    menangani operasi ini.
  */

  if(S.url){

    S.q.push({

      sheet:'__DELETE_WORKOUT__',

      rows:[[
        id
      ]]

    });

    save();

    sync();

  }


  render();

}


/* =========================================================
   REBUILD PERSONAL RECORDS
========================================================= */

function rebuildPR(){

  const prs=[];


  const byEx={};


  /*
    Kelompokkan set berdasarkan exercise.
  */

  S.sets.forEach(
    s=>{

      if(!byEx[s.ex]){
        byEx[s.ex]=[];
      }

      byEx[s.ex].push(s);

    }
  );


  Object.keys(byEx).forEach(
    ex=>{

      const sets=
        byEx[ex]
          .slice()
          .sort(
            (a,b)=>{

              const wa=
                S.workouts.find(
                  w=>w.id===a.wid
                );

              const wb=
                S.workouts.find(
                  w=>w.id===b.wid
                );

              return dateOnly(
                wa?.date||''
              )<dateOnly(
                wb?.date||''
              )
                ?-1
                :1;

            }
          );


      let bestW=0;
      let bestR=0;
      let bestV=0;


      sets.forEach(
        s=>{

          const d=
            S.workouts.find(
              w=>w.id===s.wid
            );


          if(!d)return;


          const date=
            dateOnly(d.date);


          const weight=
            Number(s.w)||0;

          const reps=
            Number(s.r)||0;

          const volume=
            Number(s.vol)||
            weight*reps;


          if(weight>bestW){

            bestW=weight;

            prs.push({

              date,

              ex,

              type:
                'Maximum Weight',

              w:weight,

              r:reps,

              vol:volume

            });

          }


          if(reps>bestR){

            bestR=reps;

            prs.push({

              date,

              ex,

              type:
                'Maximum Reps',

              w:weight,

              r:reps,

              vol:volume

            });

          }


          if(volume>bestV){

            bestV=volume;

            prs.push({

              date,

              ex,

              type:
                'Maximum Volume',

              w:weight,

              r:reps,

              vol:volume

            });

          }

        }
      );

    }
  );


  S.prs=prs;

}

   BODY DATA

function saveBody(){

  const n=id=>{

    const el=$(id);

    if(!el)return'';

    const value=

        .replace(',','.');

    return value===''
      ?''
      :Number(value);

    date:d,

    w:n('#bw'),

    waist:n('#bp'),

    bf:n('#bf'),

    mm:n('#bm'),

      $('#bn')?.value||''

  };


  if(
    !d||
    (
      r.w===''&&
      r.waist===''
    )
  ){

    return alert(
      'Isi tanggal dan minimal berat atau pinggang.'
    );

  }


  /*
    Jika tanggal sama,
    update data lama.
  */

  S.body=
    S.body.filter(
      b=>
        dateOnly(b.date)!==
        dateOnly(d)
    );


  S.body.push(r);


  save();


  /*
    Sync.
  */

  S.q.push({

    sheet:'BODY_PROGRESS',

    rows:[[
      r.date,
      r.w,
      r.waist,
      r.bf,
      r.mm,
      r.notes
    ]]

  });


  save();

  sync();

  render();

}


/* =========================================================
   GOOGLE SHEETS SYNC
========================================================= */

function setSt(s){

  stat=s;

  const p=$('#pill');

  if(!p)return;


  const n=S.q.length;


  p.textContent={

    ok:'🟢 Synced',

    sync:'🟡 Syncing',

    err:
      '🔴 Sync Error'+
      (n?' ('+n+')':''),

    off:
      '⚪ Belum terhubung'+
      (n?' ('+n+')':'')

  }[s]||'⚪';

}


/*
  Masukkan queue.
*/

function enq(sheet,rows){

  if(
    !sheet||
    !rows||
    !rows.length
  ){
    return;
  }


  S.q.push({

    sheet,

    rows

  });


  save();

  sync();

}


/*
  Sync queue satu per satu.
*/

async function sync(){

  if(!S.url){

    setSt('off');

    return;

  }


  if(syncing)return;


  syncing=true;


  try{

    while(S.q.length){

      setSt('sync');


      const item=S.q[0];


      /*
        Operasi delete memiliki endpoint
        khusus pada Apps Script.
      */

      let response;


      if(
        item.sheet==='__DELETE_WORKOUT__'
      ){

        const id=
          encodeURIComponent(
            item.rows[0][0]
          );


        response=
          await fetch(
            S.url+
            '?action=deleteWorkout&id='+
            id
          );

      }else{

        response=
          await fetch(
            S.url,
            {
              method:'POST',

              headers:{
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:
                JSON.stringify(item)
            }
          );

      }


      const j=
        await response.json();


      if(!j.ok){

        throw new Error(
          j.error||
          'Sync gagal'
        );

      }


      S.q.shift();

      save();

    }


    setSt('ok');

  }catch(e){

    console.error(e);

    setSt('err');

  }finally{

    syncing=false;

  }

}


/* =========================================================
   PULL FROM GOOGLE SHEETS
========================================================= */

async function pull(){

  if(!S.url){

    return alert(
      'Masukkan URL Web App terlebih dahulu.'
    );

  }


  await sync();


  if(S.q.length){

    return alert(
      'Masih ada data yang belum terkirim. Tunggu sampai 🟢 Synced.'
    );

  }


  try{

    setSt('sync');


    const response=
      await fetch(
        S.url+
        '?action=all'
      );


    const j=
      await response.json();


    if(
      !j||
      j.ok===false
    ){

      throw new Error(
        j?.error||
        'Response Google Sheets tidak valid'
      );

    }


    /*
      WORKOUTS
    */

    if(
      Array.isArray(
        j.WORKOUTS
      )
    ){

      S.workouts=
        j.WORKOUTS.map(
          r=>({

            id:
              String(
                r.workout_id??''
              ),

            date:
              dateOnly(
                r.date
              ),

            type:
              String(
                r.workout_type??''
              ),

            dur:
              Number(
                r.duration
              )||0,

            vol:
              Number(
                r.total_volume
              )||0,

            notes:
              String(
                r.notes??''
              )

          })
        )
        .filter(
          x=>x.id
        );

    }


    /*
      SETS
    */

    if(
      Array.isArray(
        j.SETS
      )
    ){

      S.sets=
        j.SETS.map(
          r=>({

            id:
              String(
                r.set_id??''
              ),

            wid:
              String(
                r.workout_id??''
              ),

            ex:
              String(
                r.exercise??''
              ),

            n:
              Number(
                r.set_number
              )||0,

            w:
              Number(
                r.weight
              )||0,

            r:
              Number(
                r.reps
              )||0,

            rpe:
              r.rpe===''||
              r.rpe==null
                ?''
                :Number(r.rpe),

            vol:
              Number(
                r.volume
              )||
              (
                Number(r.weight)||0
              )*
              (
                Number(r.reps)||0
              ),

            notes:
              String(
                r.notes??''
              )

          })
        );

    }


    /*
      EXERCISES
    */

    if(
      Array.isArray(
        j.EXERCISES
      )
    ){

      S.exercises=
        j.EXERCISES.map(
          r=>({

            id:
              String(
                r.exercise_id??''
              ),

            name:
              String(
                r.exercise_name??''
              ),

            active:
              r.active!==false&&
              r.active!=='FALSE'&&
              r.active!=='false'&&
              r.active!==0&&
              r.active!=='0'

          })
        )
        .filter(
          x=>x.name
        );

    }


    /*
      BODY PROGRESS
    */

    if(
      Array.isArray(
        j.BODY_PROGRESS
      )
    ){

      S.body=
        j.BODY_PROGRESS.map(
          r=>({

            date:
              dateOnly(
                r.date
              ),

            w:
              numericOrBlank(
                r.weight
              ),

            waist:
              numericOrBlank(
                r.waist
              ),

            bf:
              numericOrBlank(
                r.body_fat
              ),

            mm:
              numericOrBlank(
                r.muscle_mass
              ),

            notes:
              String(
                r.notes??''
              )

          })
        )
        .filter(
          x=>x.date
        );

    }


    /*
      PERSONAL RECORDS
    */

    if(
      Array.isArray(
        j.PERSONAL_RECORDS
      )
    ){

      S.prs=
        j.PERSONAL_RECORDS.map(
          r=>({

            date:
              dateOnly(
                r.date
              ),

            ex:
              String(
                r.exercise??''
              ),

            type:
              String(
                r.record_type??''
              ),

            w:
              Number(
                r.weight
              )||0,

            r:
              Number(
                r.reps
              )||0,

            vol:
              Number(
                r.volume
              )||0

          })
        );

    }


    /*
      Pastikan template tetap ada.
    */

    TYPES.forEach(
      t=>{

        if(
          !Array.isArray(
            S.tpl[t]
          )
        ){

          S.tpl[t]=
            DEF_TPL[t]
              ?[...DEF_TPL[t]]
              :[];

        }

      }
    );


    /*
      Jika PERSONAL_RECORDS kosong,
      hitung ulang dari SETS.
    */

    if(
      !S.prs.length &&
      S.sets.length
    ){

      rebuildPR();

    }


    S.exSynced=true;

    save();

    setSt('ok');

    render();


    alert(
      'Data dari Google Sheets berhasil dimuat.'
    );


  }catch(e){

    console.error(e);

    setSt('err');


    alert(
      'Gagal menarik data dari Sheets.\n\n'+
      e.message+
      '\n\nPeriksa URL Web App dan deployment Apps Script.'
    );

  }

}

/* =========================================================

function render(){

  const view=
    V[tab]||
    dash;


  $('#app').innerHTML=
    view();


  $('#nav').innerHTML=
    NAV.map(
      ([k,i,l])=>`

        <button
          class="${
            k===tab

              :''
          }"

          onclick="
            tab='${k}';
            render();
            scrollTo(0,0)
          "
        >

          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            ${i}
          </svg>

          ${l}

        </button>

      `
    ).join('');


  /*
    Datalist exercise aktif.
  */

  $('#dl').innerHTML=
    S.exercises
      .filter(
        e=>e.active
      )
      .map(
        e=>
          `<option value="${esc(e.name)}">`
      )
      .join('');


  setSt(stat);


  /*
    Jangan selalu mengembalikan scroll
    ke posisi lama jika user sedang
    berpindah halaman.
  */

  if(
    document.activeElement?.tagName!=='INPUT'&&
    document.activeElement?.tagName!=='SELECT'
  ){

    scrollTo(0,y);

  }

}

addEventListener(

  }
);


setInterval(
  ()=>{
    if(
      S.url&&
      S.q.length
    ){
      sync();
    }
  },
  30000
);
