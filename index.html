<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F0F7">
<title>Gym Log</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--bg:#F1F0F7;
--card:#fff;
--ink:#14122B;
--mut:#7A7891;
--ac:#3B2FF0;
--ln:#E4E2EE;
--ok:#14A06B;
--er:#E5384B;
--soft:#F6F5FB
}
[data-t=PUSH]{--tc:#FF6A3D}
[data-t=PULL]{--tc:#2E8BFF}
[data-t=LEGS]{--tc:#12B76A}
[data-t=UPPER]{--tc:#8B5CF6}
[data-t="CHEST+ARM"]{--tc:#EC4899}
[data-t=CARDIO]{--tc:#F59E0B}

*{box-sizing:border-box;margin:0}

html{scroll-behavior:smooth}

body{
font:15px/1.4 Barlow,system-ui,sans-serif;
background:var(--bg);
color:var(--ink);
padding:env(safe-area-inset-top) 0 calc(105px + env(safe-area-inset-bottom))
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 16px;
position:sticky;
top:0;
background:#f1f0f7f2;
backdrop-filter:blur(14px);
z-index:5
}

h1,h2,.big{
font-family:'Barlow Condensed',sans-serif;
font-weight:700
}

h1{font-size:28px}

h2{
font-size:22px;
margin:4px 0 10px
}

#app{
padding:0 14px 20px;
max-width:560px;
margin:auto
}

.card{
background:var(--card);
border-radius:18px;
padding:14px;
margin-bottom:10px;
box-shadow:0 2px 10px #14122b08
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:10px
}

.grid .card{margin:0}

.k,.mut{
color:var(--mut);
font-size:12px
}

.big{
font-size:28px;
line-height:1.1
}

.big small{
font-size:15px;
opacity:.7;
margin-left:4px
}

button{
font:inherit;
border:0;
border-radius:12px;
padding:10px 14px;
background:var(--ink);
color:#fff;
font-weight:600;
cursor:pointer
}

button:active{transform:scale(.98)}
button:disabled{opacity:.5}

.pri{
background:var(--ac);
width:100%;
font:700 20px 'Barlow Condensed';
padding:15px;
border-radius:16px;
margin-bottom:9px
}

.fin{background:var(--ok)}

.ghost{
background:none;
color:var(--ac);
border:1.5px dashed var(--ac);
width:100%;
margin-top:8px
}

.x{
background:none;
color:var(--mut);
padding:3px 8px;
font-size:18px
}

/* DASHBOARD */

.hero{
background:linear-gradient(135deg,#3b2ff0,#5146f5);
color:#fff;
border-radius:25px;
padding:20px;
margin-bottom:12px;
box-shadow:0 12px 30px #3b2ff025
}

.hero .k{color:#ffffffb8}

.hero-title{
font:700 31px 'Barlow Condensed';
margin-top:2px
}

.hero-meta{
color:#ffffffc7;
font-size:13px
}

.wk{
display:flex;
justify-content:space-between;
margin-top:16px
}

.wk span{
width:36px;
height:36px;
border-radius:50%;
background:#ffffff26;
display:grid;
place-items:center;
font-weight:600;
color:#ffffffcc
}

.wk span.on{
background:var(--tc);
color:#fff;
box-shadow:0 0 0 2px #fff
}

.go{
background:#fff;
color:var(--ac);
width:100%;
margin-top:16px;
font:700 20px 'Barlow Condensed';
padding:14px;
border-radius:14px
}

/* WEIGHT PROGRESS */

.section-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:10px
}

.edit-link{
background:var(--soft);
color:var(--ac);
padding:7px 10px;
border-radius:10px;
font-size:12px
}

.weight-card{padding:17px}

.weight-values{
display:flex;
justify-content:space-between;
align-items:flex-end;
gap:10px
}

.weight-now{
font:700 39px 'Barlow Condensed'
}

.weight-target{
font:700 24px 'Barlow Condensed';
text-align:right
}

.progress-track{
height:12px;
background:#eceaf5;
border-radius:99px;
overflow:hidden;
margin:12px 0 8px
}

.progress-track i{
display:block;
height:100%;
background:linear-gradient(90deg,#3b2ff0,#8b5cf6);
border-radius:99px
}

.weight-foot{
display:flex;
justify-content:space-between;
gap:8px;
color:var(--mut);
font-size:12px
}

.weight-foot b{color:var(--ink)}

/* CARDIO */

.cardio-stat{
background:linear-gradient(135deg,#fff8ed,#fff);
border:1px solid #f5d7a5
}

.cardio-stat .big{color:#d97706}

/* STRENGTH */

.strength-row{
padding:10px 0;
border-bottom:1px solid var(--ln)
}

.strength-row:last-child{border-bottom:0}

.bar{
height:8px;
background:var(--soft);
border-radius:9px;
overflow:hidden;
margin:2px 0 8px
}

.bar i{
display:block;
height:100%;
background:var(--tc);
border-radius:9px
}

.row{
display:flex;
justify-content:space-between;
gap:8px;
padding:3px 0
}

.pill,.chip{
background:#fff;
color:var(--ink);
padding:7px 12px;
border-radius:99px
}

.chips{
display:flex;
gap:6px;
flex-wrap:wrap;
margin:8px 0
}

.chip[data-t]{
box-shadow:inset 0 -3px 0 var(--tc)
}

.chip.on{
background:var(--tc,var(--ink));
color:#fff;
box-shadow:none
}

/* FORM */

input,select,textarea{
font:inherit;
padding:11px 12px;
border:1.5px solid transparent;
border-radius:12px;
width:100%;
background:var(--soft);
color:var(--ink)
}

input:focus,
select:focus,
textarea:focus{
outline:none;
border-color:var(--ac);
background:#fff
}

/* SETS */

.set{
display:grid;
grid-template-columns:55px 1fr 1fr 54px 25px;
gap:5px;
align-items:center;
margin-top:8px
}

.set input{
text-align:center;
font-weight:600;
font-size:16px;
padding:11px 4px
}

.set small{
display:block;
color:var(--mut);
font-size:11px
}

/* ACTIVE WORKOUT */

.ah{
background:var(--tc,var(--ac));
color:#fff;
border-radius:20px;
padding:16px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:flex-end
}

.ah .big{font-size:40px}

.wtimer{
display:inline-flex;
align-items:center;
gap:7px;
background:#ffffff24;
border-radius:99px;
padding:7px 11px;
font-weight:700
}

.wtimer i{
width:8px;
height:8px;
border-radius:50%;
background:#fff
}

/* CARDIO */

.cardio-card{
background:linear-gradient(135deg,#fff,#f7f6ff);
border:1px solid var(--ln)
}

.cardio-row{
display:grid;
grid-template-columns:1fr 110px;
gap:8px
}

.cardio-summary{
margin-top:10px;
padding:10px 12px;
background:var(--soft);
border-radius:12px;
display:flex;
justify-content:space-between
}

.history-cardio{
margin-top:8px;
padding:9px 11px;
border-radius:12px;
background:var(--soft);
font-size:13px
}

/* PR */

.pr{
background:#fff4cc;
border:1px solid #f5b700;
color:#6b5000
}

/* TEMPLATES */

.t5{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-bottom:14px
}

.t5 button{
background:var(--tc,var(--ac));
font:700 20px 'Barlow Condensed';
padding:18px 10px
}

.t5 button:first-child{
grid-column:span 2
}

label{
display:block;
margin-top:8px
}

.tpl-tools{
display:flex;
gap:7px;
flex-wrap:wrap;
margin:8px 0
}

.tpl-tools button{
flex:1;
min-width:110px
}

.secondary{
background:var(--soft);
color:var(--ink)
}

.empty{
text-align:center;
color:var(--mut);
padding:14px
}

.ins{background:#e9e7ff}

/* MODAL */

.mod,
.dialog-backdrop{
position:fixed;
inset:0;
background:#0008;
display:flex;
z-index:30
}

.mod>div,
.dialog{
background:#fff;
width:100%;
max-width:560px;
margin:auto auto 0;
border-radius:24px 24px 0 0;
padding:18px;
max-height:90vh;
overflow:auto
}

.dialog-backdrop{
align-items:flex-end;
justify-content:center;
padding:14px;
background:#14122b99
}

.dialog{
margin:0;
border-radius:24px;
box-shadow:0 18px 60px #0004
}

.dialog h3{
font:700 26px 'Barlow Condensed';
margin-bottom:5px
}

.dialog-sub{
color:var(--mut);
font-size:13px
}

.dialog-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:14px
}

.dialog-actions .cancel{
background:var(--soft);
color:var(--ink)
}

.dialog-actions .danger{
background:var(--er)
}

.dialog-actions .primary{
background:var(--ac)
}

/* TOAST */

.toast{
position:fixed;
left:16px;
right:16px;
bottom:92px;
max-width:528px;
margin:auto;
background:var(--ink);
color:#fff;
padding:12px 14px;
border-radius:14px;
z-index:40
}

.ch{
width:100%;
height:auto
}

/* NAV */

nav{
position:fixed;
left:12px;
right:12px;
bottom:calc(10px + env(safe-area-inset-bottom));
display:grid;
grid-template-columns:repeat(5,1fr);
background:var(--ink);
border-radius:24px;
padding:6px;
z-index:6;
max-width:536px;
margin:auto;
box-shadow:0 10px 30px #14122b30
}

nav button{
background:none;
color:#ffffff99;
padding:8px 2px;
font-size:11px;
border-radius:18px;
display:flex;
flex-direction:column;
align-items:center;
gap:2px
}

nav button.on{
background:#ffffff24;
color:#fff
}

@media(max-width:380px){
.set{
grid-template-columns:50px 1fr 1fr 50px 24px
}
.cardio-row{
grid-template-columns:1fr
}
.weight-now{
font-size:34px
}
}
</style>
</head>

<body>

<header>
<h1>Gym Log</h1>
<button class="pill" id="pill" onclick="cfg()">⚪ Belum terhubung</button>
</header>

<main id="app"></main>
<nav id="nav"></nav>
<datalist id="dl"></datalist>
<div id="dialogRoot"></div>

<script>
'use strict';

const TYPES=[
'PUSH',
'PULL',
'LEGS',
'UPPER',
'CHEST+ARM'
];

const ALL_TYPES=[
...TYPES,
'CARDIO'
];

const CARDIO_TYPES=[
'Treadmill',
'Sepeda',
'Elliptical',
'Stairmaster',
'Walking',
'Jogging',
'Rowing',
'Lainnya'
];

const MON=[
'Jan','Feb','Mar','Apr','May','Jun',
'Jul','Aug','Sep','Oct','Nov','Dec'
];

const DAY=['S','S','R','K','J','S','M'];

const K='gymlog_v2';

const DEF_EX=[
'Bench Press',
'Incline Bench Press',
'Incline Dumbbell Press',
'Dumbbell Press',
'Shoulder Press',
'Lat Pulldown',
'Seated Row',
'Barbell Row',
'Cable Row',
'Face Pull',
'Squat',
'Leg Press',
'Leg Extension',
'Leg Curl',
'Romanian Deadlift',
'Calf Raise',
'Dumbbell Curl',
'Bicep Curl',
'Tricep Pushdown',
'Lateral Raise'
];

const DEF_TPL={
PUSH:[
'Bench Press',
'Incline Dumbbell Press',
'Shoulder Press',
'Lateral Raise',
'Tricep Pushdown'
],

PULL:[
'Lat Pulldown',
'Seated Row',
'Face Pull',
'Dumbbell Curl'
],

LEGS:[
'Squat',
'Leg Press',
'Leg Extension',
'Leg Curl',
'Calf Raise'
],

UPPER:[
'Bench Press',
'Lat Pulldown',
'Shoulder Press',
'Seated Row',
'Lateral Raise',
'Bicep Curl',
'Tricep Pushdown'
],

'CHEST+ARM':[
'Bench Press',
'Incline Dumbbell Press',
'Dumbbell Press',
'Dumbbell Curl',
'Bicep Curl',
'Tricep Pushdown'
]
};

const $=s=>document.querySelector(s);

const num=v=>
Math.round((Number(v)||0)*10)/10;

const fmt=v=>
(Number(v)||0).toLocaleString('en-US',{
maximumFractionDigits:0
});

const pad=n=>
String(n).padStart(2,'0');

const esc=s=>
String(s??'')
.replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));

const slug=s=>
String(s)
.toLowerCase()
.replace(/[^a-z0-9]+/g,'-')
.replace(/^-|-$/g,'');

const today=()=>iso(new Date());

function iso(d){
return d.getFullYear()+
'-'+
pad(d.getMonth()+1)+
'-'+
pad(d.getDate());
}

function dateOnly(v){

if(!v)return '';

if(
v instanceof Date &&
!isNaN(v)
){
return iso(v);
}

let s=String(v).trim();

let m=s.match(
/^(\d{4})-(\d{2})-(\d{2})/
);

if(m){
return `${m[1]}-${m[2]}-${m[3]}`;
}

m=s.match(
/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/
);

return m
?`${m[3]}-${pad(m[2])}-${pad(m[1])}`
:s;
}

function parseDateLocal(s){

let d=dateOnly(s);

if(
!/^\d{4}-\d{2}-\d{2}$/.test(d)
){
return null;
}

let [
y,
m,
day
]=d.split('-').map(Number);

return new Date(
y,
m-1,
day
);
}

function fd(s){

let d=dateOnly(s);

let m=d.match(
/^(\d{4})-(\d{2})-(\d{2})$/
);

return m
?`${m[3]} ${MON[+m[2]-1]} ${m[1]}`
:String(s||'–');
}

function addD(s,n){

let d=
parseDateLocal(s)||
new Date();

d.setDate(
d.getDate()+n
);

return iso(d);
}

function mon(s){

let d=
parseDateLocal(s)||
new Date();

let day=
(d.getDay()+6)%7;

d.setDate(
d.getDate()-day
);

return iso(d);
}

function monthKey(s){
return dateOnly(s).slice(0,7);
}

function newWid(){

let d=new Date();

return 'W'+
String(d.getFullYear()).slice(2)+
pad(d.getMonth()+1)+
pad(d.getDate())+
'-'+
pad(d.getHours())+
pad(d.getMinutes())+
pad(d.getSeconds())+
String(d.getMilliseconds()).padStart(3,'0');
}

/* STATE */

function defaultState(){

return{

workouts:[],

sets:[],

exercises:
DEF_EX.map(
(name,i)=>({
id:'E'+(i+1),
name,
active:true
})
),

body:[],

prs:[],

tpl:
JSON.parse(
JSON.stringify(DEF_TPL)
),

q:[],

url:'',

active:null,

/* TARGET BERAT DEFAULT */
targetWeight:90,

exSynced:false

};

}

function load(){

try{

let raw=
localStorage.getItem(K);

if(raw){

let s=JSON.parse(raw);

let d=defaultState();

let o=
Object.assign(
d,
s
);

o.tpl=
Object.assign(
d.tpl,
s.tpl||{}
);

o.workouts=
Array.isArray(o.workouts)
?o.workouts
:[];

o.sets=
Array.isArray(o.sets)
?o.sets
:[];

o.exercises=
Array.isArray(o.exercises)
?o.exercises
:d.exercises;

o.body=
Array.isArray(o.body)
?o.body
:[];

o.prs=
Array.isArray(o.prs)
?o.prs
:[];

o.q=
Array.isArray(o.q)
?o.q
:[];

o.targetWeight=
Number(o.targetWeight);

if(
!isFinite(o.targetWeight)||
o.targetWeight<=0
){
o.targetWeight=90;
}

return o;

}

}catch(e){
console.error(e);
}

return defaultState();
}

let S=load();

let tab='dash';

let tplT='PUSH';

let hf={
t:'',
m:monthKey(today())
};

let pe='';

let syncing=false;

let stat='off';

function save(){

try{

localStorage.setItem(
K,
JSON.stringify(S)
);

}catch(e){
console.error(e);
}

}

function setSt(s){

stat=s;

let p=$('#pill');

if(!p)return;

let n=S.q.length;

p.textContent={
ok:'🟢 Synced',
sync:'🟡 Syncing',
err:
'🔴 Sync Error'+
(n?' ('+n+')':''),
off:
'⚪ Belum terhubung'+
(n?' ('+n+')':'')
}[s]||'⚪';

}

function toast(msg){

$('.toast')?.remove();

let t=
document.createElement('div');

t.className='toast';

t.textContent=msg;

document.body.appendChild(t);

setTimeout(
()=>t.remove(),
2600
);

}

/* DIALOG */

function dialogShell(
title,
sub,
body,
actions
){

let r=$('#dialogRoot');

r.innerHTML=`

<div
class="dialog-backdrop"
id="appDialogBackdrop"
>

<div class="dialog">

<h3>${esc(title)}</h3>

${
sub
?`<div class="dialog-sub">${esc(sub)}</div>`
:''
}

${body}

<div class="dialog-actions">
${actions}
</div>

</div>

</div>
`;

$('#appDialogBackdrop').onclick=e=>{
if(
e.target.id==='appDialogBackdrop'
){
closeDialog();
}
};

}

function closeDialog(){
$('#dialogRoot').innerHTML='';
}

function uiAlert(
msg,
title='Gym Log'
){

dialogShell(
title,
'',
`<div
style="white-space:pre-line;font-size:15px"
>${esc(msg)}</div>`,
`
<button
class="primary"
style="grid-column:1/-1"
onclick="closeDialog()"
>
Mengerti
</button>
`
);

}

let dialogOk=null;

function uiConfirm(
msg,
fn,
title='Konfirmasi'
){

dialogOk=fn;

dialogShell(
title,
'',
`<div
style="white-space:pre-line;font-size:15px"
>${esc(msg)}</div>`,
`
<button
class="cancel"
onclick="closeDialog()"
>
Batal
</button>

<button
class="danger"
onclick="dialogConfirmSubmit()"
>
Lanjutkan
</button>
`
);

}

function dialogConfirmSubmit(){

let f=dialogOk;

closeDialog();

f?.();

}

function uiPrompt(
title,
sub,
value,
fn,
placeholder='Ketik di sini…'
){

dialogOk=fn;

dialogShell(
title,
sub,
`
<label class="k">
Nama
</label>

<input
id="dialogInput"
value="${esc(value||'')}"
placeholder="${esc(placeholder)}"
>
`,
`
<button
class="cancel"
onclick="closeDialog()"
>
Batal
</button>

<button
class="primary"
onclick="dialogSubmit()"
>
Simpan
</button>
`
);

setTimeout(
()=>{
$('#dialogInput')?.focus();
$('#dialogInput')?.select();
},
30
);

}

function dialogSubmit(){

let i=$('#dialogInput');

let v=i?.value.trim();

if(!v){
return i?.focus();
}

let f=dialogOk;

closeDialog();

f?.(v);

}

/* TARGET WEIGHT */

function clamp(n,a,b){
return Math.min(
b,
Math.max(a,n)
);
}

function editTargetWeight(){

dialogShell(
'Edit Target Berat',
'Target ini dipakai untuk progress berat badan di dashboard.',
`
<label class="k">
Target berat (kg)
</label>

<input
id="targetWeightInput"
type="number"
inputmode="decimal"
min="1"
max="500"
step="0.1"
value="${num(S.targetWeight)}"
>
`,
`
<button
class="cancel"
onclick="closeDialog()"
>
Batal
</button>

<button
class="primary"
onclick="saveTargetWeight()"
>
Simpan
</button>
`
);

setTimeout(
()=>{
$('#targetWeightInput')?.focus();
$('#targetWeightInput')?.select();
},
30
);

}

function saveTargetWeight(){

let v=
Number(
String(
$('#targetWeightInput')?.value||''
)
.replace(',','.')
);

if(
!isFinite(v)||
v<1||
v>500
){

return uiAlert(
'Masukkan target berat antara 1–500 kg.',
'Target tidak valid'
);

}

S.targetWeight=
Math.round(v*10)/10;

save();

closeDialog();

render();

toast(
`Target berat disimpan: ${num(S.targetWeight)} kg`
);

}

/* DATA */

function bs(k){

return S.body
.filter(
b=>
b[k]!==''&&
b[k]!=null&&
!isNaN(Number(b[k]))
)
.sort(
(a,b)=>
dateOnly(a.date)
.localeCompare(
dateOnly(b.date)
)
);

}

function wsorted(){

return [...S.workouts]
.sort(
(a,b)=>
dateOnly(a.date)
.localeCompare(
dateOnly(b.date)
)
);

}

function exH(ex){

let m={};

S.sets
.filter(s=>s.ex===ex)
.forEach(
s=>
(
m[s.wid]||
(m[s.wid]=[])
).push(s)
);

return Object
.entries(m)
.map(
([id,ss])=>{

/* GRAPH */

function chart(
pts,
u
){

pts=
pts
.filter(
x=>
x&&
isFinite(Number(x.v))
)
.slice(-30);

if(
pts.length<2
){

return`
<p class="mut">
Butuh minimal 2 data untuk grafik.
</p>
`;

}

let W=320;
let H=120;
let p=18;

let vs=
pts.map(
x=>Number(x.v)
);

let mn=Math.min(...vs);
let mx=Math.max(...vs);

if(mn===mx){
mn-=1;
mx+=1;
}

let X=i=>
p+
i*(W-2*p)/
(pts.length-1);

let Y=v=>
H-p-
(v-mn)/(mx-mn)*
(H-2*p);

let points=
pts
.map(
(x,i)=>
X(i)+','+Y(+x.v)
)
.join(' ');

return`
<svg
viewBox="0 0 ${W} ${H}"
class="ch"
>

<polyline
fill="none"
stroke="#3B2FF0"
stroke-width="2.5"
points="${points}"
/>

${
pts.map(
(x,i)=>`
<circle
cx="${X(i)}"
cy="${Y(+x.v)}"
r="3"
fill="#3B2FF0"
/>
`
).join('')
}

<text
x="2"
y="12"
font-size="10"
fill="#6B7480"
>
${num(mx)}${u}
</text>

<text
x="2"
y="${H-4}"
font-size="10"
fill="#6B7480"
>
${num(mn)}${u}
</text>

</svg>
`;

}

function tile(k,v,c=''){

return`

}

function fmtTime(sec){

sec=
Math.max(
0,
Math.floor(+sec||0)
);

let h=
Math.floor(sec/3600);

let m=
Math.floor(
sec%3600/60
);

let s=
sec%60;

return(
h
?String(h).padStart(2,'0')+':'
:''
)+
String(m).padStart(2,'0')+
':'+
String(s).padStart(2,'0');

}

function activeElapsed(){

return S.active&&S.active.start
?Math.max(
0,
Math.floor(
(Date.now()-Number(S.active.start))/1000
)
)
:0;

}

function refreshWorkoutTimer(){

let e=
$('#workoutTimerValue');

if(
e&&
S.active
){

e.textContent=
fmtTime(
activeElapsed()
);

}

}

setInterval(
refreshWorkoutTimer,
1000
);

function vol(s){

return fmt(
(+s.w||0)*
(+s.r||0)
)+' kg';

}

function start(t){

S.active={

type:t,

date:today(),

start:Date.now(),

notes:'',

cardio:{
type:'',
duration:0
},

ex:
(S.tpl[t]||[])
.map(blank)

};

save();

render();

}

function blank(n){

let l=
[...S.sets]
.reverse()
.find(
s=>s.ex===n
);

return{

name:n,

notes:'',

sets:[
{
w:l?l.w:'',
r:l?l.r:'',
rpe:''
}
]

};

}

function ensureEx(n){

let f=
S.exercises.find(
e=>
e.name.toLowerCase()===
n.toLowerCase()
);

if(f)return f.name;

let e={
id:
'E-'+
slug(n)+
'-'+
Date.now(),
name:n,
active:true
};

S.exercises.push(e);

enq(
'EXERCISES',
[[
e.id,
e.name,
true
]]
);

return n;

}

function addEx(){

let e=$('#nx');

let v=e?.value.trim();

if(
!e||
!S.active||
!v
)return;

S.active.ex.push(
blank(
ensureEx(v)
)
);

save();

render();

setTimeout(
()=>$('#nx')?.focus(),
0
);

}

function addSet(i){

let e=
S.active.ex[i];

let l=
e.sets.at(-1)||
{
w:'',
r:''
};

e.sets.push({
w:l.w,
r:l.r,
rpe:''
});

save();

render();

}

function rmSet(i,j){

let e=
S.active.ex[i];

if(!e)return;

if(
e.sets.length>1
){
e.sets.splice(
j,
1
);
}else{
e.sets=[
{
w:'',
r:'',
rpe:''
}
];
}

save();

render();

}

function rmEx(i){

S.active.ex.splice(
i,
1
);

save();

render();

}

function up(i,j,k,v){

S.active.ex[i].sets[j][k]=
String(v).replace(',','.');

save();

let e=
$('#v'+i+'_'+j);

if(e){
e.textContent=
vol(
S.active.ex[i].sets[j]
);
}

}

function updateCardio(k,v){

if(!S.active)return;

if(!S.active.cardio){
S.active.cardio={
type:'',
duration:0
};
}

S.active.cardio[k]=
k==='duration'
?Math.max(
0,
Number(
String(v).replace(',','.')
)||0
)
:v;

save();

let e=
document.querySelector(
'.cardio-summary'
);

if(e){

e.innerHTML=`
<span>
${esc(S.active.cardio.type||'Kardio')}
</span>

<b>
${num(S.active.cardio.duration)}
menit
</b>
`;

}

}

/* GOOGLE SHEETS */

function enq(
sheet,
rows
){

if(
!rows?.length
)return;

S.q.push({
sheet,
rows
});

save();

sync();

}

async function sync(){

if(!S.url){

setSt('off');

return;

}

if(syncing)return;

syncing=true;

while(
S.q.length
){

setSt('sync');

try{

let r=
await fetch(
S.url,
{
method:'POST',
headers:{
'Content-Type':
'text/plain;charset=utf-8'
},
body:
JSON.stringify(
S.q[0]
)
}
);

let t=
await r.text();

let j=
JSON.parse(t);

if(!j.ok){
throw Error(
j.error||'Sync gagal'
);
}

S.q.shift();

save();

}catch(e){

console.error(e);

setSt('err');

syncing=false;

return;

}

}

syncing=false;

setSt('ok');

}

async function pull(){

if(!S.url){

return uiAlert(
'Masukkan URL Web App terlebih dahulu.',
'Google Sheets'
);

}

await sync();

if(S.q.length){

return uiAlert(
'Masih ada data yang belum terkirim. Pastikan status 🟢 Synced lalu coba lagi.',
'Sync belum selesai'
);

}

try{

setSt('sync');

let sep=
S.url.includes('?')
?'&'
:'?';

let r=
await fetch(
S.url+
sep+
'action=all&ts='+
Date.now(),
{
cache:'no-store'
}
);

let j=
JSON.parse(
await r.text()
);

S.workouts=
Array.isArray(j.WORKOUTS)
?j.WORKOUTS.map(
normalizeWorkoutRow
)
:[];

S.sets=
Array.isArray(j.SETS)
?j.SETS.map(
normalizeSetRow
)
:[];

if(
Array.isArray(j.EXERCISES)&&
j.EXERCISES.length

S.exercises=
j.EXERCISES
.map(
r=>({

id:
String(
r.exercise_id??''
),

name:
String(
r.exercise_name??''
),

active:
r.active!==false&&
String(
r.active
).toUpperCase()!=='FALSE'

})
)
.filter(
e=>e.name
);

}

S.body=
Array.isArray(j.BODY_PROGRESS)
?j.BODY_PROGRESS.map(
normalizeBodyRow
)
:[];

S.prs=
Array.isArray(
j.PERSONAL_RECORDS
)
?j.PERSONAL_RECORDS.map(
r=>({

date:
dateOnly(r.date),

ex:
String(
r.exercise??''
),

type:
String(
r.record_type??''
),

w:
+r.weight||0,

r:
+r.reps||0,

vol:
+r.volume||0

})
)
:[];

save();

setSt('ok');

render();

toast(
'Data dari Google Sheets berhasil dimuat.'
);

}catch(e){

console.error(e);

setSt('err');

uiAlert(
'Gagal menarik data dari Sheets.\n\n'+

'Gagal menarik data'
